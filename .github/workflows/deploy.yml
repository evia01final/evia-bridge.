name: Deploy Evia Bridge

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evia-bridge-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Verify Cloudflare token and account
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" || -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "Required GitHub secret is missing or empty. Check CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN names."
            exit 1
          fi
          CF_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n' | sed -E 's/^[[:space:]]*Bearer[[:space:]]+//I; s/^[[:space:]]+//; s/[[:space:]]+$//')"
          token_length=${#CF_TOKEN}
          echo "Token diagnostic: character count=$token_length; only letters/digits/underscore/hyphen=$( [[ "$CF_TOKEN" =~ ^[A-Za-z0-9_-]+$ ]] && echo yes || echo no ); starts_with_Bearer=$( [[ "$CF_TOKEN" =~ ^Bearer[[:space:]] ]] && echo yes || echo no ). Token value is not printed."
          if [[ "$token_length" -lt 20 || ! "$CF_TOKEN" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "The saved CLOUDFLARE_API_TOKEN does not look like a raw Cloudflare API token. Replace it with the token string only, without quotes, 'Bearer ', spaces, or line breaks."
            exit 1
          fi
          echo "Checking Cloudflare token status."
          token_json=$(curl --silent --show-error https://api.cloudflare.com/client/v4/user/tokens/verify -H "Authorization: Bearer ${CF_TOKEN}")
          echo "$token_json" | jq '{success, errors, messages, status: .result.status}'
          token_success=$(echo "$token_json" | jq -r '.success // false')
          token_status=$(echo "$token_json" | jq -r '.result.status // "unknown"')
          if [[ "$token_success" != "true" || "$token_status" != "active" ]]; then
            echo "Cloudflare did not confirm an active token. See the sanitized API error above."
            exit 1
          fi
          echo "Checking that the account ID is valid and accessible to this token."
          account_json=$(curl --silent --show-error "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}" -H "Authorization: Bearer ${CF_TOKEN}")
          echo "$account_json" | jq '{success, errors, messages, account_name: .result.name}'
          account_success=$(echo "$account_json" | jq -r '.success // false')
          if [[ "$account_success" != "true" ]]; then
            echo "Cloudflare did not confirm access to the configured account. See the sanitized API error above."
            exit 1
          fi

      - name: Validate Worker configuration
        run: wrangler deploy --dry-run
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Worker
        run: wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
